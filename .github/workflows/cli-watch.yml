# Watches multica CLI releases. REFERENCE.md §10 pins the CLI surface to a version;
# when a newer CLI ships, this opens an issue so Mops (or a human) regenerates §10
# (`multica --help` + per-group --help — the whole procedure). Automation proposes,
# a human/Mops merges — nothing lands on main automatically.
name: cli-watch
on:
  schedule: [{cron: "0 8 * * 1"}]  # weekly, Monday 08:00 UTC
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare CLI versions
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          latest=$(gh api repos/multica-ai/multica/releases/latest --jq .tag_name | sed 's/^v//')
          if [ -z "$latest" ]; then echo "::error::could not read latest CLI release — check the repo path"; exit 1; fi
          # By name, exactly as `scripts/preflight.sh` and `scripts/verify.py` read it. This line
          # was byte-identical to the positional read deleted from both of those on 2026-08-15 and
          # was missed because it is the one reader nobody watches — it runs unattended on a
          # schedule. Measured that day: it returned 0.4.23, the `MUL-5958` citation added by that
          # same release, against a §10 pinned at 0.4.26, and would have filed a false alarm on the
          # next Monday. The mirror case is quieter and worse: let a citation happen to equal
          # `latest` and this exits 0 forever while §10 goes genuinely stale.
          if [ "$(grep -c -- '<!-- cli-pin -->' REFERENCE.md)" -ne 1 ]; then echo "::error::REFERENCE.md must carry exactly one <!-- cli-pin --> marker"; exit 1; fi
          pinned=$(grep -oE '\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\* <!-- cli-pin -->' REFERENCE.md \
                   | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$pinned" ]; then echo "::error::could not read the §10 pin — the marker '**vX.Y.Z** <!-- cli-pin -->' is not in REFERENCE.md"; exit 1; fi
          echo "latest=$latest pinned=$pinned"
          [ "$latest" = "$pinned" ] && exit 0
          title="CLI v$latest released — regenerate REFERENCE §10 (pinned v$pinned)"
          gh issue list --search "$title" --json title --jq length | grep -q '^0$' || exit 0
          gh issue create --title "$title" --body "multica CLI v$latest is out; §10 pins v$pinned. Regenerate: \`multica --help\` + per-group \`--help\`, update the pinned version, PR it. (Live \`--help\` always wins over the map.)"
